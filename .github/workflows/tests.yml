name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A weekly digest push and a quick follow-up commit shouldn't queue two runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same rules the local pre-commit/pre-push hooks enforce, via the same
  # module - so a `--no-verify` bypass or an uninstalled hook still gets
  # caught before merge rather than landing in history.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files
        run: python3 scripts/hygiene.py tracked

      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: python3 scripts/hygiene.py branch "${{ github.head_ref }}"

      - name: Check hooks are committed executable
        # A non-executable hook is silently skipped by git, which looks
        # exactly like a passing repo.
        run: |
          for hook in .githooks/*; do
            mode=$(git ls-files --stage "$hook" | cut -d' ' -f1)
            [ "$mode" = "100755" ] || {
              echo "$hook is mode $mode, expected 100755."
              echo "Fix with: git update-index --chmod=+x $hook"
              exit 1
            }
          done

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the macOS system Python the launchd job actually runs on, so
        # it's the floor; the newer versions catch anything that only works
        # there.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the pipeline and its tests are stdlib-only, which is
      # deliberate - the scheduled job has to run on a laptop with no venv to
      # activate and nothing to keep up to date.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
